name: Manifest check
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install jsonschema
      - name: Validate manifests and check every url returns 200
        run: python ci/check_manifests.py
